name: tests

# Beastmode's whole premise is that nothing is validated until a gate says so.
# Running that gate on every push is the least the repo can do for itself.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Public artifact secret and private-path guard
        shell: bash
        run: ./scripts/public-artifact-guard --history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run the beastmode gate
        run: ./tests/run-all.sh

      - name: Working tree must be unchanged by the tests
        run: |
          # A test run that edits the repo hides regressions in its own
          # fixtures. tests/test-acn-parity.sh used to rewrite them on
          # every run; this check keeps that from coming back.
          if [ -n "$(git status --porcelain)" ]; then
            echo "tests modified the working tree; filenames and diff are suppressed in public logs"
            echo "changed entry count: $(git status --porcelain | wc -l)"
            exit 1
          fi

  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install and enable the worktree filesystem sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true

      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --require-hashes -r python/requirements-ci.lock
          python -m pip install --no-deps -e python

      - name: Test framework-neutral core with coverage gate
        working-directory: python
        run: python -m pytest tests --cov=src/beastmode --cov-report=term-missing

      - name: Enforce the framework-neutral core import boundary
        run: lint-imports --config python/pyproject.toml

      - name: Serve the graph through LangGraph Studio discovery
        run: python python/scripts/studio-smoke.py

      - name: Build the package
        run: python -m build --no-isolation python/

      - name: Scan the exact generated distributions
        run: ./scripts/public-artifact-guard --treeish HEAD --artifact python/dist/beastmode-*.whl --artifact python/dist/beastmode-*.tar.gz

      - name: Smoke-test the isolated wheel
        shell: bash
        run: |
          python -m venv /tmp/beastmode-wheel-smoke
          /tmp/beastmode-wheel-smoke/bin/python -m pip install --no-deps python/dist/*.whl
          /tmp/beastmode-wheel-smoke/bin/python - <<'PY'
          from beastmode.core import schema
          from beastmode.core.prompts import bm_phase_prompt
          from beastmode.core.provenance import canonical_gate_path

          assert schema.acn_contract()["concurrency_default"] > 0
          assert "MODEL DRIFT" in bm_phase_prompt()
          assert canonical_gate_path().is_file()
          PY
