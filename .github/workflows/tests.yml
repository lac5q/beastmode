name: tests

# Beastmode's whole premise is that nothing is validated until a gate says so.
# Running that gate on every push is the least the repo can do for itself.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Public artifact secret and private-path guard
        shell: bash
        run: ./scripts/public-artifact-guard --history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run the beastmode gate
        run: ./tests/run-all.sh

      - name: Working tree must be unchanged by the tests
        run: |
          # A test run that edits the repo hides regressions in its own
          # fixtures. tests/test-acn-parity.sh used to rewrite them on
          # every run; this check keeps that from coming back.
          if [ -n "$(git status --porcelain)" ]; then
            echo "tests modified the working tree:"
            git status --porcelain
            git diff
            exit 1
          fi

  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the dependency-free package test lane
        run: PIP_CONSTRAINT="$PWD/python/constraints-ci.txt" python -m pip install -c python/constraints-ci.txt -e "python[dev,langgraph]"

      - name: Test framework-neutral core
        run: python -m pytest python/tests

      - name: Build the package
        run: PIP_CONSTRAINT="$PWD/python/constraints-ci.txt" python -m build python/
